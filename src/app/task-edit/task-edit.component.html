<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/tabs/task-list"
        aria-label="Back"
      ></ion-back-button>
    </ion-buttons>
    <ion-title>{{ pageTitle }}</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="saveTask()"
        [disabled]="taskForm.invalid || saving"
        aria-label="Save"
      >
        <ion-icon slot="icon-only" name="save-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form
    [formGroup]="taskForm"
    (ngSubmit)="saveTask()"
    novalidate
    class="max-w-md mx-auto"
  >
    <ion-item lines="full" class="mb-4 rounded-lg">
      <ion-label position="floating">Title</ion-label>
      <ion-input
        formControlName="title"
        type="text"
        required
        placeholder="Task title"
        [class.invalid]="
          taskForm.get('title')?.invalid && taskForm.get('title')?.touched
        "
      ></ion-input>
    </ion-item>
    <ion-text
      *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched"
      color="danger"
      class="text-xs mb-4 block"
    >
      {{ taskForm.get('title')?.errors?.['required'] ? 'Title is required' : 'Minimum 3 characters' }}
    </ion-text>

    <ion-item lines="full" class="mb-4 rounded-lg">
      <ion-label position="floating">Description</ion-label>
      <ion-textarea
        formControlName="description"
        rows="3"
        placeholder="Details (optional)"
        auto-grow
      ></ion-textarea>
    </ion-item>

    <ion-item lines="full" class="mb-4 rounded-lg">
      <ion-label>Due Date</ion-label>
      <ion-datetime-button datetime="datetime"></ion-datetime-button>
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime
            id="datetime"
            formControlName="dueDate"
            presentation="date"
            [max]="maxDate"
            showDefaultButtons
          ></ion-datetime>
        </ng-template>
      </ion-modal>
    </ion-item>

    <ion-item lines="full" class="mb-4 rounded-lg">
      <ion-label>Photo</ion-label>
      <ion-button
        type="button"
        fill="clear"
        (click)="takePhoto()"
        aria-label="Take Photo"
      >
        <ion-icon name="camera"></ion-icon>
      </ion-button>
      <ion-button
        type="button"
        fill="clear"
        (click)="pickPhoto()"
        aria-label="Pick Photo"
      >
        <ion-icon name="images"></ion-icon>
      </ion-button>
    </ion-item>
    <ion-img *ngIf="photoUrl" [src]="photoUrl" class="task-photo"></ion-img>

    <ion-item lines="none" class="mb-4">
      <ion-label>Completed</ion-label>
      <ion-toggle
        formControlName="completed"
        slot="end"
        color="success"
      ></ion-toggle>
    </ion-item>

    <div class="flex flex-col gap-3 pt-4">
      <ion-button
        type="submit"
        expand="block"
        color="primary"
        [disabled]="taskForm.invalid || saving"
      >
        Save
      </ion-button>
      <ion-button
        expand="block"
        fill="outline"
        color="medium"
        (click)="cancel()"
      >
        Cancel
      </ion-button>
    </div>
  </form>
</ion-content>

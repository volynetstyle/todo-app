<ion-header [translucent]="true">
  <ion-toolbar color="primary" class="header-toolbar">
    <ion-title class="header-title">Tasks</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="task-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large" class="condensed-title">Tasks</ion-title>
    </ion-toolbar>
  </ion-header>

  <ng-container *ngIf="(activeTasks$ | async) as activeTasks">
    <ion-list class="task-list" *ngIf="activeTasks.length > 0">
      <ion-item-sliding *ngFor="let task of activeTasks; let i = index" #slidingItem class="task-item-sliding">
        <ion-item (click)="editTask(task.id)" class="task-item" [class.completed]="task.completed">
          <ion-checkbox
            slot="start"
            [checked]="task.completed"
            (ionChange)="toggleTaskCompletion(task.id)"
            class="task-checkbox"
          ></ion-checkbox>
          <ion-label class="task-label">
            <h2 class="task-title">{{ task.title }}</h2>
            <p class="task-description" *ngIf="task.description">{{ task.description }}</p>
            <p class="task-due" *ngIf="task.dueDate" [class.overdue]="task.dueDate < currentDate">
              Due: {{ task.dueDate | date:'mediumDate' }}
            </p>
          </ion-label>
        </ion-item>
        <ion-item-options side="end" class="task-options">
          <ion-item-option color="primary" (click)="editTask(task.id); slidingItem.close()" class="task-option">
            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
          </ion-item-option>
          <ion-item-option color="danger" (click)="confirmDelete(task.id)" class="task-option">
            <ion-icon slot="icon-only" name="trash"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ion-list>

    <div class="empty-state" *ngIf="activeTasks.length === 0">
      <ion-icon name="list-outline" class="empty-icon"></ion-icon>
      <h2 class="empty-title">No tasks</h2>
      <p class="empty-message">Add a new task to get started</p>
    </div>
  </ng-container>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="fab-container">
    <ion-fab-button (click)="addTask()" class="add-button">
      <ion-icon name="add" class="add-icon"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

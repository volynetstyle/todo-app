<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="task-list" href="/tabs/task-list">
      <ion-icon name="list"></ion-icon>
      <ion-label>Task List</ion-label>
    </ion-tab-button>
   
    <ion-tab-button tab="task-edit" href="/tabs/task-edit">
      <ion-icon name="add"></ion-icon>
      <ion-label>Add Task</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="task-completed" href="/tabs/task-completed">
      <ion-icon name="checkmark-done-outline"></ion-icon>
      <ion-label>Completed</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>

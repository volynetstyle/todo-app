<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Task Manager</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" aria-label="Logout">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
        <ion-label>Log out</ion-label>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="task-list" href="/task-list">
      <ion-icon name="list"></ion-icon>
      <ion-label>Task List</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="task-edit" href="/task-edit">
      <ion-icon name="add"></ion-icon>
      <ion-label>Add Task</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="task-completed" href="/task-completed">
      <ion-icon name="checkmark-done-outline"></ion-icon>
      <ion-label>Completed</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
